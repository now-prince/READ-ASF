<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>READ ASF</title>
<script>try{var t=localStorage.getItem('ra_theme')||'system',d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Merriweather:wght@400;700&display=swap');
:root{--bg:#141414;--sf:#1E1E1E;--tx:#F2F2EE;--t2:#8A8A85;--fill:#D4F25A;--ftx:#141414;--acc:#D4F25A;--pb:transparent;--pf:#141414;--ln:rgba(255,255,255,.1);--logo:#C8E04A;--fs:clamp(40px,12vw,72px);--wf:"Poppins",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=dark]){--bg:#F4F3EE;--sf:#E9E8E2;--tx:#1C231F;--t2:#6B746D;--fill:#2F3B30;--ftx:#F2F2EE;--acc:#4D6B12;--pb:#D4F25A;--pf:#2F3B30;--ln:rgba(0,0,0,.1);--logo:#A9C23C;color-scheme:light}
:root[data-theme=cyan]{--bg:#05090A;--sf:#0B1517;--tx:#ECFCFF;--t2:#82A5AA;--fill:#00D9F5;--ftx:#001013;--acc:#00D9F5;--pb:#08262B;--pf:#00D9F5;--ln:rgba(0,217,245,.18);--logo:#00D9F5;color-scheme:dark}:root[data-theme=readasf]{--bg:#111416;--sf:#3B3A3D;--tx:#E8E8E5;--t2:#A4A099;--fill:#3F7371;--ftx:#E8E8E5;--acc:#4C9D92;--pb:#292225;--pf:#E8E8E5;--ln:rgba(71,81,82,.55);--logo:#4C9D92;--red:#BF3B31;--red-dark:#7A3936;--steel:#475152;color-scheme:dark}
@media(min-width:900px){:root{--fs:96px}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 "Poppins",system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:center;gap:0;font-family:"Poppins",system-ui,sans-serif}.brandlogo{display:block;width:34px;height:34px;object-fit:contain}.top .brandlogo{width:32px;height:32px}
.home{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:20px 20px 12px}
.add{margin-top:28px;height:64px;border-radius:32px;background:var(--fill);color:var(--ftx);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:20px;font-weight:500;width:100%}
.pls{width:44px;height:44px;border-radius:50%;background:var(--pb);color:var(--pf);display:grid;place-items:center}
.home h2{margin:32px 0 12px;font-size:20px;font-weight:500;color:var(--t2)}
:root[data-theme=dark] .home h2{color:var(--tx)}
.list{flex:1;overflow-y:auto;min-height:0;-webkit-user-select:none;user-select:none}
.empty{margin-top:28px;text-align:center;color:var(--t2);flex:1}
.row{display:flex;align-items:center;gap:14px;background:var(--sf);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.tile{width:48px;height:48px;border-radius:14px;background:var(--bg);color:var(--acc);display:grid;place-items:center;flex:none}
.rb{flex:1;min-width:0}.rt{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:13px;color:var(--t2)}
.pl{height:3px;background:var(--ln);border-radius:2px;margin-top:8px;overflow:hidden}.pl i{display:block;height:100%;background:var(--acc)}
.row>svg{color:var(--t2);flex:none}
.foot{padding-top:8px}.gear{width:48px;height:48px;border-radius:50%;background:var(--sf);display:grid;place-items:center;color:var(--t2)}
.rd{position:relative;height:100%;display:flex;flex-direction:column;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;transition:opacity .25s}
.ib{width:44px;height:44px;border-radius:50%;background:var(--sf);display:grid;place-items:center}
.stage{position:absolute;inset:0;touch-action:none;cursor:pointer}
.wb{position:absolute;left:0;right:0;top:42%;font-size:calc(var(--fs)*var(--fsm,1))}
.word{position:absolute;left:0;right:0;top:0;transform:translateY(-50%);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);font-family:var(--wf);font-weight:500;line-height:1;white-space:pre;letter-spacing:var(--ls,0em)}
#eb{text-align:right}#ep{color:var(--acc)}#ea{text-align:left}
.tk{position:absolute;background:var(--acc);opacity:.5}
.tt,.tb{left:50%;width:2px;height:.45em;margin-left:-1px}.tt{top:-.95em}.tb{top:.5em}
.tl,.tr{top:-1px;height:2px;width:.5em}.tl{left:calc(50% - min(44vw,340px))}.tr{right:calc(50% - min(44vw,340px))}
.hint{position:absolute;left:0;right:0;top:calc(var(--fs)*1.15);text-align:center;font:14px "Poppins",system-ui,sans-serif;color:var(--t2)}
.bot{position:relative;z-index:1;margin-top:auto;padding:0 20px 16px;transition:opacity .25s}
.rd.fz[data-st=playing] .top,.rd.fz[data-st=playing] .bot{opacity:0;pointer-events:none}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.seek{flex:1;height:44px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.trk{width:100%;height:3px;background:var(--ln);border-radius:2px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(0)}
#pc{font-size:14px;color:var(--acc);min-width:3.2em;text-align:right}
.ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{height:52px;min-width:52px;padding:0 14px;border-radius:18px;background:var(--sf);display:flex;align-items:center;justify-content:center;gap:6px}
.wpm{flex-basis:100%;max-width:260px;padding:0 4px;justify-content:space-between}
.wpm button{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.wpm button:disabled{opacity:.3;cursor:default}
.wn{text-align:center;line-height:1.1}.wn b{font-size:20px;font-weight:500;display:block}.wn small{font-size:11px;color:var(--t2);letter-spacing:.08em}
.tm{background:none;border:1px solid var(--ln);color:var(--t2);cursor:default}
#ab{font-family:var(--wf);font-size:20px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sh{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--ln);border-radius:24px 24px 0 0;padding:20px;max-height:90%;overflow:auto}
@media(min-width:600px){#ov{align-items:center}.sh{border-radius:24px}}
.sh h3{font-size:18px;font-weight:500;margin-bottom:12px}
input,textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:inherit;margin-bottom:10px}
textarea{min-height:140px;resize:vertical}
.btn{height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--ln);background:var(--sf)}
.btn.pri{background:var(--fill);color:var(--ftx);border-color:transparent}.btn:disabled{opacity:.4;cursor:default}
.bt{display:flex;gap:10px;justify-content:flex-end;margin:4px 0 12px}
.sm{font-size:12px;color:var(--t2)}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg .btn{flex:1;padding:0}.seg .on{background:var(--fill);color:var(--ftx)}
.dng{width:100%;color:#D9534F}:root[data-theme=readasf] .dng{color:#BF3B31}
#ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;display:none;align-items:center;gap:14px;z-index:9;max-width:90%;font-size:15px}
#ts button{font-weight:600;text-decoration:underline}

/* ---------- document/section layer ---------- */
.docbar{position:relative;z-index:3;padding:2px 20px 10px;display:flex;align-items:stretch;gap:8px}
.secbtn{width:44px;height:44px;border-radius:14px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);display:grid;place-items:center;flex:none}
.secbtn:active,.secnav:active{background:var(--ln)}.secbtn:disabled{opacity:.3;cursor:default}
.secnav{position:relative;overflow:hidden;min-width:0;flex:1;height:44px;border-radius:14px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);padding:0 8px 0 12px;display:flex;align-items:center;gap:8px;text-align:left}
.sectext{min-width:0;flex:1;display:flex;align-items:baseline;gap:8px}
.secnum{font-size:12px;font-weight:600;color:var(--acc);flex:none;font-variant-numeric:tabular-nums}
.sectitle{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.secprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ln)}
.secprog i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(0)}
.secdown{color:var(--t2);display:grid;place-items:center;flex:none}
.section-sheet .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}.section-sheet .section-head h3{margin:0}
.section-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.section-item{min-height:48px;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px;border-radius:12px;background:var(--sf);border:1px solid var(--ln)}
.section-item.on{border-color:var(--acc);background:var(--fill);color:var(--ftx)}.section-item.past{opacity:.55}
.section-item b{font-size:12px;min-width:26px;color:var(--acc);font-variant-numeric:tabular-nums}.section-item.on b{color:inherit}
.section-item span{font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-item small{font-size:11px;color:var(--t2);flex:none}.section-item.on small{color:inherit;opacity:.75}
.sgrp{display:flex;flex-direction:column;gap:6px}.srow{display:flex;gap:6px}.srow .section-item{flex:1;min-width:0}
.sxp{flex:none;min-width:56px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--t2)}.sxp svg{width:18px;height:18px;transition:transform .15s}.sxp[aria-expanded=true]{color:var(--acc);border-color:var(--acc)}.sxp[aria-expanded=true] svg{transform:rotate(180deg)}
.skids{display:flex;flex-direction:column;gap:6px;padding-left:12px;margin-left:10px;border-left:2px solid var(--ln)}.section-item.l3{margin-left:14px}
.fontlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.fontlist .btn{height:52px;border-radius:14px;padding:0 12px;text-align:left}.fontlist .btn.on{background:var(--fill);color:var(--ftx);border-color:transparent}
.importnote{margin:0 0 12px;color:var(--t2);font-size:12px;line-height:1.45}
.modegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 12px}.modegrid .btn{height:50px;padding:0 5px;font-size:12px}.modegrid .btn.on{background:var(--fill);color:var(--ftx);border-color:transparent}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.addgrid .btn{min-height:92px;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left}.addgrid .btn>span{font-size:17px;font-weight:500}.addgrid .btn small{font-size:11px;line-height:1.25;color:var(--t2)}
.filepick{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:25px;background:var(--sf);border:1px solid var(--ln);margin-bottom:10px}
.filemeta{font-size:12px;color:var(--t2);margin:-4px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rapidchip{font-size:12px;font-weight:600;letter-spacing:.02em}.rapidchip.on{background:var(--fill);color:var(--ftx)}.rapid-start{font-weight:700}.rapid-end{font-weight:600;opacity:.92}
@media(max-width:380px){.sectitle{max-width:50%}.docbar{padding-left:12px;padding-right:12px}.docbar .secnav{padding:0 9px}}
</style>
</head>
